name: Release from artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of the build run that uploaded the shizuku-apks artifact'
        required: true
      tag:
        description: 'Existing tag to create the release for'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download built APKs from previous run
        uses: actions/download-artifact@v4
        with:
          name: shizuku-apks
          path: apks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: true
          files: apks/apk/release/*.apk
          body: |
            ## ⚠️ 签名风险警告 / Signature Warning

            本 Release 的 APK 使用 **debug 调试密钥**签名（CI 无发布密钥），与官方 Shizuku 签名**不同**：

            - **无法覆盖安装官方版**，必须先卸载官方版再安装（已授权应用列表保存在 server 侧，不受影响；应用自身设置会重置）
            - 签名不同意味着**基于签名校验的权限/组件交互与官方版不互通**（例如其他应用若通过 `checkSignatures` 验证 Shizuku 会失败）
            - 无法通过 Google Play / 官方渠道升级，之后装回官方版也需先卸载本版本
            - 仅供测试 Android 17 修复使用，**请勿当作官方版本分发**

            ## 内容

            修复 Android 17 (API 37) 上"已授权应用"列表为空的问题（RikkaApps/Shizuku#1988, RikkaApps/Shizuku#2180）。

            按设备架构选择 APK，不确定就选 `release.apk`（universal 通用包）。
